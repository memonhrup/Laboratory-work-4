name: Print Software Versions

on:
  push:

jobs:
  PrintLanguageVersions:
    runs-on: ubuntu-latest
    steps:
      - name: Print Java versions
        run: |
          java -version
          javac -version
      - name: Install and print Apache Tomcat version
        run: |
          sudo apt-get update
          sudo apt-get install -y tomcat10
          dpkg -s tomcat10 | grep Version

  PrintDBMSVersions:
    runs-on: ubuntu-latest
    needs: PrintLanguageVersions
    steps:
      - name: Print PostgreSQL client version
        run: psql --version
      - name: Start PostgreSQL and print server version
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "SELECT version();"
